name: Pages
# Deploys the public marketplace only after the CI workflow has succeeded for a
# push to main. workflow_run always executes this file from the default branch,
# never from a pull request, and only push events on main are accepted below.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
# One deployment at a time. A queued run is replaced by a newer one, and an
# in-progress deployment is never interrupted. Each job additionally refuses
# commits that are no longer the main tip, so a rerun of an older CI run can
# never overwrite a newer site.
concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false
jobs:
  # Application code builds with read-only permissions and no deployment rights.
  build:
    if: github.repository == 'sarangp3010/open-skill-kit' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      current: ${{ steps.tip.outputs.current }}
    env:
      DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Skip commits that are no longer the main tip
        id: tip
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT"
          tip="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)"
          if [ "$tip" = "$DEPLOY_COMMIT" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$DEPLOY_COMMIT is superseded by main $tip; its own CI run deploys it"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.tip.outputs.current == 'true'
        with:
          node-version: 22
          package-manager-cache: false
      - if: steps.tip.outputs.current == 'true'
        run: npm install --global pnpm@10.20.0 --ignore-scripts
      - if: steps.tip.outputs.current == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: steps.tip.outputs.current == 'true'
        run: pnpm catalog:check
      # Release build: the dependency-licensing preflight runs and fails closed
      # while any distributed dependency lacks exact-release provenance.
      - name: Build the browser release for the project subpath
        if: steps.tip.outputs.current == 'true'
        run: pnpm build
        env:
          OPEN_SKILL_KIT_RELEASE_BUILD: '1'
          VITE_BASE_PATH: /open-skill-kit/
      - name: Stamp and verify the deployable site
        if: steps.tip.outputs.current == 'true'
        run: pnpm pages:verify --stamp
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.tip.outputs.current == 'true'
        with:
          path: apps/web/dist
          retention-days: 1

  # Only the official deployment action runs with Pages/OIDC write permissions.
  # No checkout, install or application code runs in this job.
  deploy:
    needs: build
    if: needs.build.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Refuse to deploy a superseded commit
        run: |
          tip="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)"
          test "$tip" = "$DEPLOY_COMMIT"
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
