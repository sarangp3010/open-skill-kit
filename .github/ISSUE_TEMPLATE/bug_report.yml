name: Bug report
description: Report a reproducible non-security defect
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: For vulnerabilities or leaked private data, use SECURITY.md rather than this public form. Paste only sanitized diagnostics.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, affected skill ID or URL, and environment
      description: Include OS, Node/pnpm/browser or CLI versions and the failing command.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized diagnostics and local check results
  - type: checkboxes
    id: privacy
    attributes:
      label: Reporting checks
      options:
        - label: This report contains no secrets, private data or undisclosed vulnerability details.
          required: true
